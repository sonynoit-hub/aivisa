<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VisaSense — Neo AI Layout (Full Suite)</title>
    <!-- Tailwind CSS CDN (play CDN good for prototyping) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
              mono: ['JetBrains Mono','ui-monospace','SFMono-Regular']
            },
            container: { center: true, padding: { DEFAULT: '1rem', md: '1.5rem' } },
            colors: {
              brand: {
                50: '#F5FAFF', 100: '#E6F0FF', 200: '#CCE1FF', 300: '#99C3FF', 400: '#66A5FF',
                500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8', 800: '#1E40AF', 900: '#1E3A8A'
              },
              neon: {
                blue: '#60A5FA',
                cyan: '#22D3EE',
                violet: '#A78BFA'
              }
            },
            boxShadow: {
              soft: '0 6px 24px -8px rgba(15, 23, 42, 0.18)',
              glow: '0 0 0 1px rgba(99,102,241,0.15), 0 8px 40px -8px rgba(59,130,246,0.45)'
            },
            borderRadius: { '2xl': '1rem' },
            backgroundImage: {
              grid: "linear-gradient(rgba(148,163,184,.25) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.25) 1px, transparent 1px)",
              glow: 'radial-gradient(600px 200px at 50% -20%, rgba(99,102,241,.20), rgba(99,102,241,0))',
              mesh: 'radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,.15), transparent 40%), radial-gradient(1000px 500px at 90% -20%, rgba(167,139,250,.18), transparent 40%)'
            },
            animation: {
              shimmer: 'shimmer 2.2s linear infinite',
              float: 'float 6s ease-in-out infinite',
              pulseGlow: 'pulseGlow 3s ease-in-out infinite'
            },
            keyframes: {
              shimmer: { '0%': { backgroundPosition: '-1000px 0' }, '100%': { backgroundPosition: '1000px 0' } },
              float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-6px)' } },
              pulseGlow: { '0%,100%': { boxShadow: '0 0 0 0 rgba(99,102,241,0.25)' }, '50%': { boxShadow: '0 0 0 8px rgba(99,102,241,0.0)' } }
            }
          }
        }
      }
    </script>
    <style>
      html{scroll-behavior:smooth}
      .no-scrollbar::-webkit-scrollbar{display:none}
      .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
      .active-tab{color:#22D3EE;border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.08)}
      .glass{backdrop-filter: blur(10px); background: rgba(255,255,255,.7)}
      .glass-dark{backdrop-filter: blur(12px); background: rgba(2,6,23,.5)}
      .code-badge{font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular;}
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 bg-mesh">
    <!-- content trimmed for brevity; identical to src/doc/test.html -->
  </body>
</html>
